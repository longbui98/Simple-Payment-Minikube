apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-database-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-database
  template:
    metadata:
      labels:
        app: payment-database
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "postgres"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: payment-database-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: payment-database
spec:
  type: ClusterIP
  selector:
    app: payment-database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP