apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
        - name: payment-processor
          image: payment-processor:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            #CockroachDB
            - name: SERVER_PORT
              value: "8080"
            - name: DB_URL
              value: "jdbc:postgresql://cockroachdb-public:26257/paymentdb?sslmode=disable"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: ""

            #SQS
            - name: SQS_ENDPOINT
              value: "http://localstack:4566"
            - name: SPRING_CLOUD_AWS_REGION_STATIC
              value: "us-east-1"
            - name: SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY
              value: "test"
            - name: SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY
              value: "test"

            # DragonFly DB
            - name: REDIS_HOST
              value: "dragonfly"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dragonfly-secret
                  key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
        - name: payment-api
          image: payment-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: PROCESSOR_URL
              value: "http://payment-processor"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
      annotations:
        rollout.info/updated-at: "2026-10-20T01:12:00Z"
    spec:
      containers:
        - name: wallet-service
          image: wallet-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: DB_URL
              value: "jdbc:postgresql://cockroachdb-public:26257/paymentdb?sslmode=disable"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: ""
            - name: SQS_ENDPOINT
              value: "http://localstack:4566"
            - name: SPRING_CLOUD_AWS_REGION_STATIC
              value: "us-east-1"
            - name: SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY
              value: "test"
            - name: SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY
              value: "test"