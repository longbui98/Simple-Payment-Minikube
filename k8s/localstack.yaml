apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "sqs"
            - name: DEBUG
              value: "1"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: LOCALSTACK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: localstack-auth
                  key: token
          startupProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            failureThreshold: 30
            periodSeconds: 10
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            failureThreshold: 3
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 5